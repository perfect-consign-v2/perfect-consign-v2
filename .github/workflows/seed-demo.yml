name: seed-demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-demo
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed mall and shop on the demo host
        env:
          DEMO_SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          DEMO_SSH_USER: ${{ secrets.DEMO_SSH_USER }}
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          DEMO_SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEMO_SSH_HOST DEMO_SSH_USER DEMO_SSH_KEY DEMO_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "seed-demo: missing ${name}" >&2
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEMO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          umask 077
          printf '%s\n' "$DEMO_SSH_KEY" > ~/.ssh/demo_key
          # wipe_tenant must run as a superuser (SECURITY DEFINER) so it can
          # set event_triggers when clearing append-only password_resets.
          ssh -i ~/.ssh/demo_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${DEMO_SSH_USER}@${DEMO_SSH_HOST}" \
            'set -euo pipefail
             cd "$HOME"
             db_name=$(grep -E "^STALL_DB_NAME=" .env | head -n1 | cut -d= -f2- | tr -d "\"'\''")
             db_user=$(grep -E "^STALL_DB_USER=" .env | head -n1 | cut -d= -f2- | tr -d "\"'\''")
             if [[ -z "$db_name" || -z "$db_user" ]]; then
               echo "seed-demo: STALL_DB_NAME/USER missing from .env" >&2
               exit 1
             fi
             if [[ ! "$db_user" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]; then
               echo "seed-demo: refusing STALL_DB_USER" >&2
               exit 1
             fi
             sudo -u postgres psql -d "$db_name" -v ON_ERROR_STOP=1 \
               -c "ALTER FUNCTION platform.wipe_tenant(text) OWNER TO CURRENT_USER;" \
               -c "GRANT EXECUTE ON FUNCTION platform.wipe_tenant(text) TO \"$db_user\";" \
               -c "GRANT EXECUTE ON FUNCTION platform.wipe_tenant(text) TO stall_app;"
             /opt/plesk/php/8.5/bin/php bin/seed-mall.php
             /opt/plesk/php/8.5/bin/php bin/set-owner.php mall owner'
