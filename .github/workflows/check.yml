name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Obligation base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "OBLIGATION_BASE=$(git merge-base HEAD FETCH_HEAD)" >> "$GITHUB_ENV"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "OBLIGATION_BASE=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
            else
              echo "OBLIGATION_BASE=$before" >> "$GITHUB_ENV"
            fi
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, zip, curl
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist
      - run: docker compose up -d postgres
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 30); do
            docker exec perfect-consign-postgres pg_isready -U stall -d consign && exit 0
            sleep 2
          done
          exit 1
      - name: Apply the platform schema
        run: php bin/provision-platform.php
      - run: composer check
      - run: composer test:coverage
        env:
          STALL_DB_HOST: 127.0.0.1
          STALL_DB_PORT: '5436'
          STALL_DB_NAME: consign
          STALL_DB_USER: stall
          STALL_DB_PASSWORD: stall
          STALL_APP_PASSWORD: ci-app-password
          STALL_OWNER_PASSWORD: ci-owner-password
          STALL_BACKUP_PASSWORD: ci-backup-password
