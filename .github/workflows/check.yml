name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      STALL_DB_HOST: 127.0.0.1
      STALL_DB_PORT: '5436'
      STALL_DB_NAME: consign
      STALL_DB_USER: stall
      STALL_DB_PASSWORD: stall
      STALL_APP_PASSWORD: ci-app-password
      STALL_OWNER_PASSWORD: ci-owner-password
      STALL_BACKUP_PASSWORD: ci-backup-password
      STALL_WORKER_PASSWORD: ci-worker-password
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2
      - name: Obligation base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "OBLIGATION_BASE=$(git merge-base HEAD FETCH_HEAD)" >> "$GITHUB_ENV"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "OBLIGATION_BASE=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
            else
              if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "$before" || git fetch --no-tags --unshallow origin
              fi
              if ! git cat-file -e "$before^{commit}"; then
                echo "obligation base $before is not in this clone" >&2
                exit 1
              fi
              echo "OBLIGATION_BASE=$before" >> "$GITHUB_ENV"
            fi
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, zip, curl
      - run: composer install --no-interaction --prefer-dist
      - run: docker compose up -d postgres
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 30); do
            docker exec perfect-consign-postgres pg_isready -U stall -d consign && exit 0
            sleep 2
          done
          exit 1
      - name: Apply the platform schema
        run: php bin/provision-platform.php
      - name: Enable stall_app, stall_backup, and stall_worker logins
        run: php bin/enable-stall-app.php
      - run: composer check
