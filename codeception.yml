namespace: PerfectConsign\Tests\Codeception
support_namespace: Support

params:
    - tests/Codeception/params.php

paths:
    tests: tests/Codeception
    output: tests/Codeception/_output
    data: tests/Codeception/_data
    support: tests/Codeception/Support
bootstrap: _bootstrap.php

settings:
    colors: true
    memory_limit: 1024M

extensions:
    enabled:
        - Codeception\Extension\RunFailed

suites:
    functional:
        actor: FunctionalTester
        path: Functional
        modules:
            enabled:
                - Asserts
                - PhpBrowser:
                    url: '%WEB_BASE_URL%'
                    timeout: 60
                - PerfectConsign\Tests\Codeception\Support\Helper\Functional
    acceptance:
        actor: AcceptanceTester
        path: Acceptance
        modules:
            enabled:
                - Asserts
                - PerfectConsign\Tests\Codeception\Module\ChromeBrowser
                - PerfectConsign\Tests\Codeception\Support\Helper\Acceptance
